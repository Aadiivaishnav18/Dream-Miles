<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Dream Miles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
   
        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

      
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

    
        .peer:checked ~ .toggle-bg { background-color: #2563eb; } 
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://www.pexels.com/download/video/5608053/" type="video/mp4">
    </video>
    
    <div class="overlay"></div>

    <div class="bg-white/10 backdrop-blur-xl shadow-2xl rounded-2xl p-8 w-full max-w-md text-center border border-white/20">
        <h2 class="text-3xl font-bold mb-6 text-white">Welcome Back!</h2>

        <form id="loginForm" class="space-y-5 text-left">
            <div>
                <label for="email" class="block text-gray-200 font-medium mb-1 text-sm">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required
                    class="w-full px-4 py-3 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-400">
            </div>

            <div>
                <label for="password" class="block text-gray-200 font-medium mb-1 text-sm">Password</label>
                <input type="password" id="password" placeholder="********" required
                    class="w-full px-4 py-3 border border-white/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white/10 text-white placeholder-gray-400">
            </div>

            <div class="flex items-center justify-between">
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="remember" class="sr-only peer">
                    <div class="w-11 h-6 bg-white/20 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    <span class="ml-3 text-sm font-medium text-gray-200">Remember Me</span>
                </label>
                <a href="#" class="text-blue-400 hover:underline text-sm font-medium">Forgot Password?</a>
            </div>

            <button type="submit"
                class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg hover:bg-blue-600 transition-all shadow-lg active:scale-95">
                Sign In
            </button>
        </form>

        <div class="flex items-center my-6">
            <hr class="flex-grow border-white/20">
            <span class="mx-3 text-white/50 text-xs">OR</span>
            <hr class="flex-grow border-white/20">
        </div>

        <div class="space-y-3">
            <button class="w-full flex items-center justify-center space-x-2 py-3 border border-white/10 rounded-lg bg-white/90 text-gray-800 font-medium hover:bg-white transition-colors">
                <img src="https://img.icons8.com/color/20/google-logo.png" alt="Google">
                <span>Continue with Google</span>
            </button>
            <button class="w-full flex items-center justify-center space-x-2 py-3 border border-white/10 rounded-lg bg-[#1877F2] text-white font-medium hover:bg-[#166fe5] transition-colors">
                <img src="https://img.icons8.com/ios-filled/20/ffffff/facebook-new.png" alt="Facebook">
                <span>Continue with Facebook</span>
            </button>
        </div>

        <p class="mt-8 text-sm text-gray-300">
            Don't have an account? <a href="./SignUp.html" class="text-blue-400 font-bold hover:underline">Sign Up</a>
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            if (email && password) {
                alert(`Logging in...\nEmail: ${email}`);
             window.location.href="./Explore.html";
            } else {
                alert("Please enter email and password.");
            }
        });
    </script>
</body>
</html>
