<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Dream Miles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow: hidden; 
        }

        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); 
            z-index: -1;
        }

        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen">

    <video autoplay muted loop playsinline class="video-bg">
        <source src="https://www.pexels.com/download/video/5608053/" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="overlay"></div>

    <div class="bg-white/10 backdrop-blur-xl shadow-2xl rounded-2xl p-8 w-full max-w-md text-center border border-white/20">
        
        <h2 class="text-4xl font-bold mb-2 text-white">Welcome!</h2>
        <p class="text-white/70 mb-8 text-sm">Please enter your details to sign in.</p>

        <form id="loginForm" class="space-y-6 text-left">
            
            <div>
                <label for="email" class="block text-white font-medium mb-1.5 ml-1 text-sm">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required
                    class="w-full px-4 py-3 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white/10 text-white placeholder-white/40 transition-all">
            </div>

            <div>
                <label for="password" class="block text-white font-medium mb-1.5 ml-1 text-sm">Password</label>
                <input type="password" id="password" placeholder="••••••••" required
                    class="w-full px-4 py-3 border border-white/20 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white/10 text-white placeholder-white/40 transition-all">
            </div>
            
            <div class="flex items-center justify-between text-white">
                <label class="relative inline-flex items-center cursor-pointer group">
                    <input type="checkbox" id="remember" class="sr-only peer">
                    <div class="w-11 h-6 bg-white/20 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    <span class="ms-3 text-sm font-medium text-white/80 group-hover:text-white transition-colors">Remember Me</span>
                </label>

                <a href="#" class="text-blue-300 hover:text-blue-100 transition-colors text-sm font-medium">Forgot Password?</a>
            </div>
            
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-[0.98] mt-4">
                Sign Up
            </button>
        </form>

        <div class="flex items-center my-8">
            <hr class="flex-grow border-white/20">
            <span class="mx-3 text-white/40 text-xs uppercase tracking-widest">or</span>
            <hr class="flex-grow border-white/20">
        </div>
   
        <p class="text-sm text-white/70">
         Have an account? 
            <a href="./Sign In.html" class="text-blue-300 font-bold hover:underline ml-1">Sign In</a>
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const remember = document.getElementById("remember").checked;
            
            if(email && password) {
              
                console.log("Login attempt:", { email, remember });
                alert(`Welcome back, ${email}!\nRemember Me: ${remember ? 'Yes' : 'No'}`);
            } else {
                alert("Please fill in all fields.");
            }
        });
    </script>

</body>
</html>
